name: Semantic Retrieval Live Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI embedding model
        required: true
        default: text-embedding-3-small
        type: choice
        options:
          - text-embedding-3-small
          - text-embedding-3-large
      dimensions:
        description: Embedding dimensions (1536 small default; up to 3072 large)
        required: true
        default: "1536"
        type: string
      runs:
        description: Repeated benchmark runs for consistency evidence
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EMBEDDING_MODEL: ${{ inputs.model }}
      OPENAI_EMBEDDING_DIMENSIONS: ${{ inputs.dimensions }}
      OPENAI_EMBEDDING_TIMEOUT_MS: "15000"
      EVALUATION_RUNS: ${{ inputs.runs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require evaluation credential
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is required for the live semantic evaluation workflow."
            exit 1
          fi

      - name: Validate workflow inputs
        shell: bash
        run: |
          if ! [[ "$OPENAI_EMBEDDING_DIMENSIONS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Embedding dimensions must be a positive integer."
            exit 1
          fi

          case "$OPENAI_EMBEDDING_MODEL" in
            text-embedding-3-small) max_dimensions=1536 ;;
            text-embedding-3-large) max_dimensions=3072 ;;
            *)
              echo "::error::Unsupported embedding model."
              exit 1
              ;;
          esac

          if [ "${#OPENAI_EMBEDDING_DIMENSIONS}" -gt 4 ] ||
             [ "$OPENAI_EMBEDDING_DIMENSIONS" -gt "$max_dimensions" ]; then
            echo "::error::Dimensions exceed the selected model's supported maximum."
            exit 1
          fi

          case "$EVALUATION_RUNS" in
            1|3|5) ;;
            *)
              echo "::error::Evaluation runs must be 1, 3, or 5."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Verify live provider adapter
        run: npm run test:semantic-provider-adapter -w @reposcout/api

      - name: Verify repeated-run summarizer
        run: npm run test:semantic-live-runner -w @reposcout/api

      - name: Run repeated live benchmark
        run: >-
          npm run eval:semantic-retrieval:live:batch -w @reposcout/api --
          --runs "$EVALUATION_RUNS"
          --output-dir "artifacts/semantic-evaluation"

      - name: Publish evaluation summary
        shell: bash
        run: |
          {
            echo "## Semantic retrieval evaluation"
            echo
            printf -- '- Model: `%s`\n' "$OPENAI_EMBEDDING_MODEL"
            printf -- '- Dimensions: `%s`\n' "$OPENAI_EMBEDDING_DIMENSIONS"
            printf -- '- Repeated runs: `%s`\n' "$EVALUATION_RUNS"
            echo
            echo "\`summary.json\` and every raw run are attached as the workflow artifact."
            echo
            echo "\`\`\`json"
            cat artifacts/semantic-evaluation/summary.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: semantic-retrieval-evaluation-${{ github.run_id }}
          path: artifacts/semantic-evaluation/
          if-no-files-found: warn
          retention-days: 30
