name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: reposcout
          POSTGRES_PASSWORD: reposcout
          POSTGRES_DB: reposcout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reposcout -d reposcout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://reposcout:reposcout@127.0.0.1:5432/reposcout_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify Jev evaluation harness
        run: npm run test:evaluation -w @reposcout/api

      - name: Verify ranking benchmark
        run: npm run test:ranking -w @reposcout/api

      - name: Apply migrations
        run: npm run db:migrate -w @reposcout/api

      - name: Verify repositories schema
        run: npm run test:schema -w @reposcout/api

      - name: Roll back latest migration
        run: npm run db:migrate:down -w @reposcout/api

      - name: Verify rollback state
        run: npm run test:schema:down -w @reposcout/api

      - name: Reapply migrations
        run: npm run db:migrate -w @reposcout/api

      - name: Verify repository persistence
        run: npm run test:persistence -w @reposcout/api

      - name: Verify repository snapshot persistence
        run: npm run test:snapshots -w @reposcout/api

      - name: Verify repository content evidence
        run: npm run test:content -w @reposcout/api

      - name: Verify GitHub ingestion operations
        run: npm run test:ingestion -w @reposcout/api

      - name: Verify repository issue ingestion
        run: npm run test:issues -w @reposcout/api

      - name: Verify repository catalog API
        run: npm run test:catalog -w @reposcout/api

      - name: Verify repository lexical search
        run: npm run test:search -w @reposcout/api

      - name: Verify repository submission workflows
        run: npm run test:submissions -w @reposcout/api

      - name: Verify PostgreSQL connection
        run: npm run test:db -w @reposcout/api
